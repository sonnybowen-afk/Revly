name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # Deploys straight from the working branch too, so the site can go
      # live before the branch is merged. Drop this line once it is.
      - claude/install-ui-ux-pro-max-skill-k136h6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken scheduler must not reach production.
      - name: Unit tests
        run: npm run test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API if it isn't already, so the first
          # deploy needs no manual trip to repository settings. Requires the
          # pages: write permission granted above.
          enablement: true

      - name: Build
        env:
          DEPLOY_TARGET: github-pages
          # Project sites live at /<repo>. configure-pages resolves the real
          # base path, which is "" when a custom domain is attached.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages

      # Stops Pages from applying Jekyll rules and dropping _next/.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
