name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Broken logic must not reach a client-facing site.
      - name: Unit tests
        run: npm run test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on via the API if it isn't already, so the first
          # deploy needs no manual trip to repository settings.
          enablement: true

      - name: Build
        env:
          DEPLOY_TARGET: github-pages
          # "" on a custom domain, "/<repo>" on a project site.
          # configure-pages works out which, so nothing here changes when
          # the domain is attached.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages

      # ── The custom domain switch ──────────────────────────────────
      # A CNAME file in the artifact tells Pages to serve the site on
      # that domain, and github.io then redirects to it. So it stays out
      # until the DNS is actually pointed here — otherwise the preview
      # URL breaks and the site is reachable at neither address.
      #
      # To go live: set a repository variable CUSTOM_DOMAIN to
      # anniesecrethairextension.co.uk (Settings → Secrets and variables
      # → Actions → Variables), with the DNS records from README.md
      # already in place. Nothing else needs changing.
      - name: Attach custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME

      # Stops Pages applying Jekyll rules and dropping _next/.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
