name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Test and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 is required: the test runner uses native TypeScript
          # type stripping rather than a transpile step.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (scheduler + timetable)
        run: npm run test

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build
